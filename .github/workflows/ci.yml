name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m unittest discover -s tests
      - run: npm test
      - run: python -m scripts.make_preview Retail_Forecaster_Demo.html
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: retail-forecaster-offline
          path: Retail_Forecaster_Demo.html
          if-no-files-found: error
